services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    logging:
      options:
        max-size: 10m
        max-file: "2"
    env_file:
      - .env
    ports:
      - "${HOMARR_PORT:-80}:7575"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - homarr_appdata:/appdata
      - homarr_icons:/public/icons

volumes:
  homarr_appdata:
  homarr_icons:
