name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: Stack to smoke test
        required: true
        default: all
        type: choice
        options:
          - all
          - databases/postgres
          - network/headscale

permissions:
  contents: read

jobs:
  postgres:
    name: Smoke Postgres
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'databases/postgres' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databases/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d

      - name: Wait for health
        run: |
          cid="$(docker compose ps -q postgres)"
          test -n "$cid"
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Probe database
        run: docker compose exec -T postgres sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

      - name: Stop stack
        if: always()
        run: docker compose down -v

  headscale:
    name: Smoke Headscale
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'network/headscale' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: network/headscale
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d

      - name: Wait for container
        run: |
          cid="$(docker compose ps -q headscale)"
          test -n "$cid"
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Status}}' "$cid")"
            if [ "$status" = "running" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Probe API port
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)"
          case "$code" in
            200|404)
              exit 0
              ;;
            *)
              docker compose ps
              docker compose logs --no-color
              exit 1
              ;;
          esac

      - name: Stop stack
        if: always()
        run: docker compose down -v
