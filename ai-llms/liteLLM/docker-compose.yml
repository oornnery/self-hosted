services:
  litellm:
    image: ${LITELLM_IMAGE}
    container_name: ${LITELLM_CONTAINER_NAME}
    ports:
      - "${LITELLM_PORT}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${LITELLM_DB_NAME}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-litellm}
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 640m
    logging:
      options:
        max-size: 15m
        max-file: "2"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          urllib.request.urlopen("http://localhost:4000/health/liveliness", timeout=5)
          sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - ai-llms-network
      - monitoring-network
      - database-network

networks:
  ai-llms-network:
    external: true
    name: ${AI_LLMS_NETWORK:-ai-llms-network}
  monitoring-network:
    external: true
    name: ${MONITORING_NETWORK:-${SIGNOZ_NETWORK:-signoz-net}}
  database-network:
    external: true
    name: database-network
