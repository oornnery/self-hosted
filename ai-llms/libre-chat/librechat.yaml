version: 1.3.6

cache: true

interface:
  customWelcome: "LibreChat via LiteLLM"
  endpointsMenu: true
  modelSelect: true
  presets: true
  bookmarks: true
  multiConvo: true

endpoints:
  custom:
    - name: "LiteLLM"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "${LITELLM_BASE_URL}"
      models:
        default:
          - "gpt-4o"
          - "gpt-4o-mini"
          - "claude-sonnet-4"
          - "gemini-2.0-flash"
          - "deepseek-chat"
          - "ollama-llama3.2"
          - "ollama-mistral"
        fetch: false
      titleConvo: true
      summarize: false

modelSpecs:
  list:
    - name: "gpt-4o"
      label: "GPT-4o"
      preset:
        endpoint: "LiteLLM"
        model: "gpt-4o"
    - name: "gpt-4o-mini"
      label: "GPT-4o Mini"
      preset:
        endpoint: "LiteLLM"
        model: "gpt-4o-mini"
    - name: "claude-sonnet-4"
      label: "Claude Sonnet 4"
      preset:
        endpoint: "LiteLLM"
        model: "claude-sonnet-4"
    - name: "gemini-2.0-flash"
      label: "Gemini 2.0 Flash"
      preset:
        endpoint: "LiteLLM"
        model: "gemini-2.0-flash"
    - name: "deepseek-chat"
      label: "DeepSeek Chat"
      preset:
        endpoint: "LiteLLM"
        model: "deepseek-chat"
    - name: "ollama-llama3.2"
      label: "Llama 3.2 (Ollama)"
      preset:
        endpoint: "LiteLLM"
        model: "ollama-llama3.2"
    - name: "ollama-mistral"
      label: "Mistral (Ollama)"
      preset:
        endpoint: "LiteLLM"
        model: "ollama-mistral"
