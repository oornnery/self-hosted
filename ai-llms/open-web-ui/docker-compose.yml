services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    env_file:
      - .env
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 1536m
    logging:
      options:
        max-size: 15m
        max-file: "2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - ai-llms-network

volumes:
  open-webui-data:

networks:
  ai-llms-network:
    external: true
    name: ai-llms-network
