services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELPATH=/ollama/models
    user: "${OLLAMA_UID:-1000}:${OLLAMA_GID:-1000}"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-llms-network
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 3072m
    logging:
      options:
        max-size: 25m
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    tmpfs:
      - /tmp

volumes:
  ollama-data:

networks:
  ai-llms-network:
    external: true
    name: ai-llms-network
