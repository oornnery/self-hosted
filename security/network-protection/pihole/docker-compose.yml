services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"    # DNS TCP
      - "53:53/udp"    # DNS UDP
      - "67:67/udp"    # DHCP (opcional)
      - "8090:80/tcp"  # Interface web
    volumes:
      - pihole_conf:/etc/pihole        # Configurações persistentes
      - dnsmasq_conf:/etc/dnsmasq.d    # Arquivos dnsmasq
    env_file: .env                      # Usa variáveis do arquivo .env
    cap_add:
      - NET_ADMIN

volumes:
  pihole_conf:   # Volume nomeado para /etc/pihole
  dnsmasq_conf:  # Volume nomeado para /etc/dnsmasq.d
