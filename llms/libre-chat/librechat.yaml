version: 1.2.8       # esquema atual

# ================= ENDPOINTS PRINCIPAIS =================
openAI:            # mantém compatibilidade se usar chave OpenAI nativa
  titleConvo: true
  summarize: false

assistants:        # opcional, se pretender usar Assistants API
  pollingIntervalMs: 2000
  timeoutMs: 90000

# ============ ENDPOINTS VIA OPENROUTER =============
custom:
  - name: "OpenRouter"                # agrupador principal
    apiKey: "${OPENROUTER_KEY}"
    baseURL: "https://openrouter.ai/api/v1"
    fetch: false                      # definiremos manualmente os modelos
    models:
      default:
        - "openai/o3"                 # OpenAI o3
        - "perplexity/sonar-small"    # Perplexity Sonar (free)
        - "perplexity/sonar-medium"   # Perplexity Sonar Pro
        - "mistralai/mistral-7b-instruct"
        - "google/gemini-pro"
        - "anthropic/claude-3-haiku-20240307"
      requestOverrides:
        headers:
          HTTP-Referer: "https://yourdomain.local"   # recomendação da OpenRouter
          X-Title: "LibreChat self-hosted"

# ============== PRESETS VISÍVEIS NO UI ==============
presets:
  - name: "OpenAI o3"
    endpoint: "OpenRouter"
    model: "openai/o3"
    temperature: 0.7

  - name: "Perplexity Sonar (free)"
    endpoint: "OpenRouter"
    model: "perplexity/sonar-small"
    temperature: 0.7

  - name: "Perplexity Sonar Pro"
    endpoint: "OpenRouter"
    model: "perplexity/sonar-medium"
    temperature: 0.7

  - name: "Mistral-7B"
    endpoint: "OpenRouter"
    model: "mistralai/mistral-7b-instruct"
    temperature: 0.7

  - name: "Gemini Pro"
    endpoint: "OpenRouter"
    model: "google/gemini-pro"
    temperature: 0.7

  - name: "Claude 3 Haiku"
    endpoint: "OpenRouter"
    model: "anthropic/claude-3-haiku-20240307"
    temperature: 0.7
