services:
  crowdsec:
    image: ${CROWDSEC_IMAGE}
    container_name: ${CROWDSEC_CONTAINER_NAME}
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
      CUSTOM_HOSTNAME: crowdsec
      BOUNCER_KEY_TRAEFIK: ${CROWDSEC_TRAEFIK_BOUNCER_KEY}
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - traefik_logs:/var/log/traefik:ro
      - crowdsec_data:/var/lib/crowdsec/data
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 384m
    logging:
      options:
        max-size: 15m
        max-file: "2"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: ${TRAEFIK_CONTAINER_NAME}
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT}:8080"
    depends_on:
      crowdsec:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik_logs:/var/log/traefik
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 0.30
    mem_limit: 256m
    logging:
      options:
        max-size: 10m
        max-file: "2"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  traefik_logs:
  crowdsec_data:
