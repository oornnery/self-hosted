global:
  scrape_interval: 60s
  evaluation_interval: 60s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "http-health"
    metrics_path: /probe
    params:
      module: ["http_ok"]
    static_configs:
      - targets:
          - "http://host.docker.internal:8001/health"
          - "http://host.docker.internal:4000/health/liveliness"
          - "http://host.docker.internal:11434/api/tags"
          - "http://host.docker.internal:3000/"
          - "http://host.docker.internal:3080/"
          - "http://host.docker.internal:80/"
          - "http://host.docker.internal:8080/api/v1/health"
          - "http://host.docker.internal:8090/admin/"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
