x-common: &common
  networks:
    - signoz-net
  restart: unless-stopped
  logging:
    options:
      max-size: 20m
      max-file: "2"

x-clickhouse-defaults: &clickhouse-defaults
  <<: *common
  image: clickhouse/clickhouse-server:25.5.6
  tty: true
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9363"
    signoz.io/path: "/metrics"
  depends_on:
    init-clickhouse:
      condition: service_completed_successfully
    zookeeper-1:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
    interval: 30s
    timeout: 5s
    retries: 3
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
  cpus: 1.00
  mem_limit: 1536m

x-zookeeper-defaults: &zookeeper-defaults
  <<: *common
  image: signoz/zookeeper:3.7.1
  user: root
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: "/metrics"
  healthcheck:
    test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
    interval: 30s
    timeout: 5s
    retries: 3
  cpus: 0.20
  mem_limit: 256m

x-db-depend: &db-depend
  <<: *common
  depends_on:
    clickhouse:
      condition: service_healthy

services:
  init-clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - ./signoz-common/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
    cpus: 0.20
    mem_limit: 128m

  zookeeper-1:
    <<: *zookeeper-defaults
    container_name: signoz-zookeeper-1
    volumes:
      - zookeeper-1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141

  clickhouse:
    <<: *clickhouse-defaults
    container_name: signoz-clickhouse
    volumes:
      - ./signoz-common/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./signoz-common/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./signoz-common/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./signoz-common/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
      - ./signoz-common/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - clickhouse:/var/lib/clickhouse/

  signoz:
    <<: *db-depend
    image: signoz/signoz:${VERSION:-v0.114.1}
    container_name: signoz
    ports:
      - "${SIGNOZ_UI_PORT}:8080"
    volumes:
      - sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TOKENIZER_JWT_SECRET=secret
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 0.30
    mem_limit: 384m

  otel-collector:
    <<: *db-depend
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-v0.144.2}
    container_name: signoz-otel-collector
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./signoz-otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./signoz-common/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      - "${SIGNOZ_OTLP_GRPC_PORT}:4317"
      - "${SIGNOZ_OTLP_HTTP_PORT}:4318"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/13133'"]
      interval: 30s
      timeout: 5s
      retries: 5
    cpus: 0.30
    mem_limit: 384m

  signoz-telemetrystore-migrator:
    <<: *db-depend
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-v0.144.2}
    container_name: signoz-telemetrystore-migrator
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    restart: on-failure
    cpus: 0.20
    mem_limit: 256m

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}
    container_name: ${POSTGRES_EXPORTER_CONTAINER_NAME}
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: ${DATA_SOURCE_URI}
      DATA_SOURCE_USER: ${DATA_SOURCE_USER}
      DATA_SOURCE_PASS: ${DATA_SOURCE_PASS}
    restart: unless-stopped
    networks:
      - database-network
      - signoz-net
    cpus: 0.05
    mem_limit: 64m

  otel-bridge:
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: ${OTEL_COLLECTOR_CONTAINER_NAME}
    env_file:
      - .env
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - forwarder_logs:/var/log/forwarder:ro
    restart: unless-stopped
    depends_on:
      postgres-exporter:
        condition: service_started
      otel-collector:
        condition: service_healthy
    networks:
      - signoz-net
    cpus: 0.20
    mem_limit: 192m

  docker-log-forwarder:
    image: docker:27-cli
    container_name: docker-log-forwarder
    environment:
      FORWARD_CONTAINERS: ${FORWARD_CONTAINERS}
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /var/log/forwarder
        for c in ${FORWARD_CONTAINERS}; do
          (
            while true; do
              docker logs --timestamps --since 2s -f "$$c" >> "/var/log/forwarder/$$c.log" 2>&1 || true
              sleep 2
            done
          ) &
        done
        wait
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forwarder_logs:/var/log/forwarder
    networks:
      - signoz-net
    cpus: 0.05
    mem_limit: 64m

networks:
  signoz-net:
    name: ${SIGNOZ_NETWORK}
  database-network:
    external: true
    name: database-network

volumes:
  clickhouse:
    name: signoz-clickhouse-data
  sqlite:
    name: signoz-sqlite-data
  zookeeper-1:
    name: signoz-zookeeper-data
  forwarder_logs:
